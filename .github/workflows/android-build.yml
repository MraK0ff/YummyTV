name: ReYummy Optimized Build

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

# Один общий слот: новый запуск отменяет предыдущий, в том числе на другой ветке.
concurrency:
  group: reyummy-optimized-build
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          compile_sdk=$(grep -m1 '^android-compileSdk' gradle/libs.versions.toml | cut -d'"' -f2)
          case "$compile_sdk" in
            *.*) platform_version="$compile_sdk" ;;
            *)   platform_version="$compile_sdk.0" ;;
          esac
          echo "compileSdk=$compile_sdk -> platforms;android-$platform_version"
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-$platform_version"

      - name: Build debug APK
        run: ./gradlew :app:assembleReleaseDebug --stacktrace

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-70
          path: core/storage/schemas/su.afk.yummy.tv.core.storage.db.AppDatabase/71.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Re-sign APK with the standard Android testkey
        shell: bash
        run: |
          set -euo pipefail

          key_dir="$RUNNER_TEMP/android-testkey"
          mkdir -p "$key_dir"

          # AOSP's public test signing key (not suitable for production releases).
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.pk8"
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.x509.pem"

          # apksigner --key requires unencrypted PKCS#8 in DER format.
          # AOSP's .pk8 file is already in that format; do not convert it to PEM.
          openssl pkcs8 -inform DER -nocrypt \
            -in "$key_dir/testkey.pk8" \
            -out /dev/null

          # Confirm that the downloaded certificate belongs to this private key.
          openssl pkey -inform DER -in "$key_dir/testkey.pk8" -pubout \
            -out "$key_dir/key-public.pem"
          openssl x509 -in "$key_dir/testkey.x509.pem" -pubkey -noout \
            > "$key_dir/cert-public.pem"
          diff -u "$key_dir/key-public.pem" "$key_dir/cert-public.pem"

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"

          shopt -s nullglob
          apks=(app/build/outputs/apk/releaseDebug/*.apk)
          test "${#apks[@]}" -gt 0

          for apk in "${apks[@]}"; do
            "$apksigner" sign \
              --key "$key_dir/testkey.pk8" \
              --cert "$key_dir/testkey.x509.pem" \
              "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Upload optimized APK
        uses: actions/upload-artifact@v7
        with:
          name: reyummy-optimized-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest ReYummy release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ReYummy — Latest build
          target_commitish: main
          make_latest: true
          prerelease: false
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/*.apk
