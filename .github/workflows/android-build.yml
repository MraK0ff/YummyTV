name: Android Debug Build

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          compile_sdk=$(grep -m1 '^android-compileSdk' gradle/libs.versions.toml | cut -d'"' -f2)
          case "$compile_sdk" in
            *.*) platform_version="$compile_sdk" ;;
            *)   platform_version="$compile_sdk.0" ;;
          esac
          echo "compileSdk=$compile_sdk -> platforms;android-$platform_version"
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-$platform_version"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Re-sign APK with the standard Android testkey
        shell: bash
        run: |
          set -euo pipefail

          key_dir="$RUNNER_TEMP/android-testkey"
          mkdir -p "$key_dir"

          # AOSP's public test signing key (not suitable for production releases).
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.pk8"
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.x509.pem"

          openssl pkey -inform DER -in "$key_dir/testkey.pk8" -out "$key_dir/testkey.pem"

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"

          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -gt 0

          for apk in "${apks[@]}"; do
            "$apksigner" sign \
              --key "$key_dir/testkey.pem" \
              --cert "$key_dir/testkey.x509.pem" \
              "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: yummytv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
